<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Emergency Tracking — Smart Wari Connect Admin</title>
<link rel="icon" href="assets/images/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="emergency-tracking" data-title="Live Emergency Tracking">
<div class="app-shell">
  <aside id="sidebar"></aside>
  <div class="flex-grow-1" style="min-width:0;">
    <header id="topbar"></header>
    <main id="page-content">

      <div class="page-header fade-up">
        <div class="breadcrumb-mini">Admin / Emergency Response / Live Emergency Tracking</div>
        <h1>Live Emergency Tracking</h1>
        <p>Select an active emergency to follow the assigned van's live location on the map.</p>
      </div>

      <div class="card-surface mb-4 fade-up">
        <div class="section-title">
          <span class="live-dot" style="width:9px;height:9px;background:var(--danger);border-radius:50%;display:inline-block;animation:pulse-red 1.4s infinite;"></span>
          <h5>Active Emergency</h5>
          <span class="ms-auto" style="max-width:340px;width:100%;">
            <select class="form-select" id="trackEmergencySelect"></select>
          </span>
        </div>
        <div class="row g-3" id="trackDetails"></div>
      </div>

      <div class="card-surface mb-4 fade-up">
        <div class="section-title">
          <span class="flag-dot"></span><h5>Live Map</h5>
          <span class="muted-note" id="trackUpdatedNote">Updating every 4s</span>
        </div>
        <div class="map-frame"><div id="trackMap" style="height:480px;"></div></div>
        <div class="d-flex flex-wrap gap-3 mt-3 small text-muted">
          <span>📍 <span class="legend-dot" style="background:var(--saffron)"></span>Varkari Location</span>
          <span>🚑 <span class="legend-dot" style="background:var(--danger)"></span>Emergency Van</span>
          <span>🏥 <span class="legend-dot" style="background:#7C3AED"></span>Medical Center</span>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/emergency-data.js"></script>
<script src="assets/js/emergency-common.js"></script>
<script src="assets/js/emergency-tracking.js"></script>
</body>
</html>
