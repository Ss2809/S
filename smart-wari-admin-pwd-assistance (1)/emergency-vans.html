<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergency Vans — Smart Wari Connect Admin</title>
<link rel="icon" href="assets/images/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="emergency-vans" data-title="Emergency Vans">
<div class="app-shell">
  <aside id="sidebar"></aside>
  <div class="flex-grow-1" style="min-width:0;">
    <header id="topbar"></header>
    <main id="page-content">

      <div class="page-header fade-up">
        <div class="breadcrumb-mini">Admin / Emergency Response / Emergency Vans</div>
        <h1>Emergency Van Management</h1>
        <p>Fleet status, assigned volunteers and live GPS state for every emergency van.</p>
      </div>

      <div class="row g-3 mb-3" id="vanStats"></div>

      <div class="table-surface fade-up">
        <div class="table-toolbar">
          <div class="global-search" style="max-width:280px;"><i class="bi bi-search"></i><input type="text" id="vanSearch" placeholder="Search vans…"></div>
          <select class="form-select" id="vanStatusFilter" style="max-width:180px;">
            <option value="">All Status</option>
            <option>AVAILABLE</option><option>DISPATCHED</option><option>ON THE WAY</option><option>OFFLINE</option>
          </select>
          <button class="btn btn-flag ms-auto" data-bs-toggle="modal" data-bs-target="#vanModal"><i class="bi bi-plus-lg"></i> Add Van</button>
        </div>
        <div class="table-responsive">
        <table class="wari-table" id="vanTable">
          <thead><tr>
            <th>Van Number</th><th>Vehicle Type</th><th>Assigned Volunteer</th><th>Assigned Wari Stop</th>
            <th>Status</th><th>Latitude</th><th>Longitude</th><th>Last Updated</th><th>Current Emergency</th><th>Actions</th>
          </tr></thead>
          <tbody id="vanTbody"></tbody>
        </table>
        </div>
      </div>

    </main>
  </div>
</div>

<div class="modal fade" id="vanModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content" style="border-radius:16px;">
      <div class="modal-header"><h5 class="modal-title font-display">Emergency Van</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label small fw-semibold">Van Number</label><input class="form-control" id="vanModalNumber" placeholder="AMB-006"></div>
          <div class="col-md-6"><label class="form-label small fw-semibold">Vehicle Type</label><select class="form-select" id="vanModalType"><option>Ambulance</option><option>Mini Van</option></select></div>
          <div class="col-md-6"><label class="form-label small fw-semibold">Assigned Volunteer</label><input class="form-control" id="vanModalVolunteer" placeholder="Volunteer name"></div>
          <div class="col-md-6"><label class="form-label small fw-semibold">Assigned Wari Stop</label>
            <select class="form-select" id="vanModalStop"></select>
          </div>
          <div class="col-md-6"><label class="form-label small fw-semibold">Status</label>
            <select class="form-select" id="vanModalStatus"><option>AVAILABLE</option><option>DISPATCHED</option><option>ON THE WAY</option><option>OFFLINE</option></select>
          </div>
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-outline-soft" data-bs-dismiss="modal">Cancel</button><button class="btn btn-flag" id="vanModalSave" data-bs-dismiss="modal">Save Van</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/emergency-data.js"></script>
<script src="assets/js/emergency-common.js"></script>
<script>
function vanRenderStats(){
  const available = EMERGENCY_VANS.filter(v => v.status === "AVAILABLE").length;
  const onWay = EMERGENCY_VANS.filter(v => v.status === "ON THE WAY" || v.status === "DISPATCHED").length;
  const offline = EMERGENCY_VANS.filter(v => v.status === "OFFLINE").length;
  const cards = [
    ["var(--emerald-50)","var(--emerald)","bi-check-circle-fill", available, "Available Vans"],
    ["#FEF2F2","var(--danger)","bi-truck-front-fill", onWay, "Vans On The Way"],
    ["#F1F5F9","var(--muted)","bi-power", offline, "Offline"],
    ["var(--saffron-50)","var(--saffron)","bi-broadcast", EMERGENCY_VANS.length, "Total Fleet"]
  ];
  document.getElementById('vanStats').innerHTML = cards.map(([bg,color,icon,val,label]) => `
    <div class="col-6 col-md-3"><div class="stat-mini fade-up"><div class="ic" style="background:${bg};color:${color};"><i class="bi ${icon}"></i></div>
    <div><div class="kpi-value font-data" style="font-size:1.2rem;">${val}</div><div class="small text-muted">${label}</div></div></div></div>`).join('');
  document.getElementById('vanModalStop').innerHTML = WARI_STOPS.map(s => `<option>${s}</option>`).join('');
}

function vanRenderTable(){
  const q = (document.getElementById('vanSearch').value || '').toLowerCase();
  const statusF = document.getElementById('vanStatusFilter').value;
  const rows = EMERGENCY_VANS.filter(v => (!statusF || v.status === statusF) && (!q || Object.values(v).join(' ').toLowerCase().includes(q)));
  document.getElementById('vanTbody').innerHTML = rows.map(v => `
    <tr>
      <td class="fw-semibold font-data">${v.number}</td>
      <td>${v.type}</td>
      <td>${v.volunteer}</td>
      <td>${v.stop}</td>
      <td><span class="badge-status ${emStatusBadgeClass(v.status)}">${v.status}</span></td>
      <td class="font-data">${v.lat.toFixed(4)}</td>
      <td class="font-data">${v.lng.toFixed(4)}</td>
      <td class="font-data text-nowrap"><span class="live-dot" style="width:6px;height:6px;display:inline-block;margin-right:5px;${v.status==='OFFLINE'?'background:var(--muted);animation:none;':'background:var(--danger);'}border-radius:50%;"></span>${v.updated}</td>
      <td class="font-data">${v.emergency}</td>
      <td class="table-actions">
        <a class="btn btn-outline-soft" href="emergency-tracking.html?van=${v.number}" title="Track"><i class="bi bi-geo-alt"></i></a>
        <button class="btn btn-outline-soft" title="Call"><i class="bi bi-telephone"></i></button>
      </td>
    </tr>`).join('') || '<tr><td colspan="10" class="text-center text-muted py-4">No vans match your filters.</td></tr>';
}

document.getElementById('vanModalSave').addEventListener('click', () => {
  const number = document.getElementById('vanModalNumber').value.trim();
  if (!number){ wariToast('Van number is required', 'danger'); return; }
  const stop = document.getElementById('vanModalStop').value;
  const [lat, lng] = WARI_STOP_COORDS[stop] || [0,0];
  EMERGENCY_VANS.push({
    number, type: document.getElementById('vanModalType').value,
    volunteer: document.getElementById('vanModalVolunteer').value || 'Unassigned',
    stop, status: document.getElementById('vanModalStatus').value,
    lat, lng, emergency: '—', updated: 'just now'
  });
  vanRenderTable();
  wariToast(`${number} added to the fleet`);
});

document.addEventListener('DOMContentLoaded', () => {
  vanRenderStats();
  vanRenderTable();
  ['vanSearch','vanStatusFilter'].forEach(id => document.getElementById(id).addEventListener('input', vanRenderTable));
});
</script>
</body>
</html>
